#
# Synapse release — manual. Run from the Actions tab (or `workflow_dispatch`)
# on `main` after the version bump has merged. It checks that the requested
# version matches pyproject.toml, takes the release notes from the matching
# CHANGELOG.md section, then creates the git tag and the GitHub release.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 0.1.1)"
        required: true
        type: string
      prerelease:
        description: "Mark as a pre-release (the 0.x line is alpha)"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version matches pyproject.toml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          grep -q "^version = \"${VERSION}\"" pyproject.toml || {
            echo "pyproject.toml version does not match ${VERSION}" >&2
            exit 1
          }
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ inputs.version }}
        run: |
          awk -v v="## [${VERSION}]" '
            index($0, v) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md || {
            echo "No CHANGELOG.md section found for ${VERSION}" >&2
            exit 1
          }
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=""
          if [ "${PRERELEASE}" = "true" ]; then flags="--prerelease"; fi
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "Synapse v${VERSION}" \
            --notes-file release-notes.md \
            ${flags}
