# Synapse CI — runs the Python test suite on every push and pull request.
# The commands below mirror tests/unit/README.md:
#   pip install -e ".[dev]"
#   pytest
# (pytest's testpaths are configured in pyproject.toml:
#  tests, packages/adapters, packages/synapse-cli/tests.)

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest
